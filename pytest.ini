[pytest]
# Pytest configuration for Opentrons app + ODD E2E tests

# Test discovery patterns
python_files = test_*.py *_test.py main.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    -s
    --tb=short
    --strict-markers
    --disable-warnings
    --html=test-results/report.html
    --self-contained-html

# Markers
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    smoke: Opentrons app navigation smoke tests
    device_cards: Opentrons app device card tests
    odd: Flex On-Device Display (ODD) CDP tests

# Playwright options
playwright_args = --browser chromium

# Timeout
timeout = 300
